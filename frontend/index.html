<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Tasks</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f2f2f2">
<meta name="color-scheme" content="light">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css?v=13">
<script>
  // Where the API lives. Point this at the fly.io app once deployed.
  globalThis.API_BASE = "https://artur-todo-list-api.fly.dev";
</script>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header__bar">
      <h1 class="header__title">Tasks <span class="header__user" id="who"></span></h1>

      <div class="header__side">
        <span class="header__count" id="summary"></span>

        <div class="menu">
          <button type="button" class="menu__toggle" id="options"
                  aria-haspopup="true" aria-expanded="false" aria-label="Options">⌄</button>
          <div class="menu__panel" id="menu-panel" hidden>
            <button type="button" class="menu__item" id="show-repeats">Repeats</button>
            <button type="button" class="menu__item" id="notifications" hidden></button>
            <button type="button" class="menu__item" id="signout">Sign out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Filter tasks by when they happen">
      <button type="button" class="filter" data-state="passed" aria-pressed="false">
        <span class="filter__icon" aria-hidden="true">🕓</span>
        <span>Passed</span>
        <span class="filter__count" data-count="passed"></span>
      </button>
      <button type="button" class="filter" data-state="actual" aria-pressed="true">
        <span class="filter__icon" aria-hidden="true">🎯</span>
        <span>Actual</span>
        <span class="filter__count" data-count="actual"></span>
      </button>
      <button type="button" class="filter" data-state="upcoming" aria-pressed="false">
        <span class="filter__icon" aria-hidden="true">🌱</span>
        <span>Upcoming</span>
        <span class="filter__count" data-count="upcoming"></span>
      </button>
    </div>

    <div class="categories" id="categories" role="group" aria-label="Filter tasks by category"></div>
  </header>

  <main>
    <h2 class="visually-hidden">Task list</h2>
    <div class="list" id="list"></div>
    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
  </main>
</div>

<button type="button" class="fab fab--clear" id="cleanup" aria-label="Clear the passed tasks shown here" hidden>🧹</button>
<button type="button" class="fab" id="add" aria-label="Add a task">+</button>

<dialog class="composer" id="signin">
  <form method="dialog" id="signin-form">
    <h2 class="composer__title">Sign in</h2>
    <p class="composer__note" id="signin-note">
      Your username and password stay on this device and are sent with each request.
    </p>

    <label class="field">
      <span class="field__label">Username</span>
      <input class="field__input" name="username" required autocomplete="username"
             autocapitalize="none" spellcheck="false" placeholder="artur">
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input class="field__input" name="password" type="password" required
             autocomplete="current-password" placeholder="letters and digits">
    </label>

    <div class="composer__actions">
      <button type="button" class="btn" id="signup">Create account</button>
      <button type="submit" class="btn btn--primary" value="signin">Sign in</button>
    </div>
  </form>
</dialog>

<dialog class="composer" id="repeats">
  <header class="wizard__bar">
    <h2 class="composer__title">Repeats</h2>
    <button type="button" class="wizard__back" id="repeats-close" aria-label="Close">✕</button>
  </header>
  <p class="composer__note">
    Each one keeps a single event waiting in the list. Deleting a repeat removes the events it made.
  </p>
  <div id="repeats-list"></div>
</dialog>

<dialog class="composer" id="composer">
  <div class="wizard">
    <header class="wizard__bar">
      <button type="button" class="wizard__back" id="wizard-back" aria-label="Back">←</button>
      <h2 class="composer__title" id="wizard-title">New task</h2>
      <button type="button" class="wizard__back" id="wizard-close" aria-label="Close">✕</button>
    </header>

    <p class="wizard__steps" id="wizard-steps" aria-live="polite"></p>

    <!-- Step 1: what kind of thing is this? -->
    <section class="wizard__step" data-step="kind">
      <div class="choices">
        <button type="button" class="choice" data-kind="BASIC">
          <span class="choice__icon" aria-hidden="true">📋</span>
          <span class="choice__name">One-time task</span>
          <span class="choice__hint">Something to do, no particular time</span>
        </button>
        <button type="button" class="choice" data-kind="EVENT">
          <span class="choice__icon" aria-hidden="true">📅</span>
          <span class="choice__name">Event</span>
          <span class="choice__hint">Happens at a specific date and time</span>
        </button>
        <button type="button" class="choice" data-kind="REPEATED">
          <span class="choice__icon" aria-hidden="true">🔁</span>
          <span class="choice__name">Repeats</span>
          <span class="choice__hint">A rule that keeps making events for you</span>
        </button>
      </div>
    </section>

    <!-- Step 2a: which schedule? (repeats only) -->
    <section class="wizard__step" data-step="schedule" hidden>
      <div class="choices">
        <button type="button" class="choice" data-schedule="DAILY">
          <span class="choice__icon" aria-hidden="true">☀️</span>
          <span class="choice__name">Daily</span>
          <span class="choice__hint">Every so often between two times</span>
        </button>
        <button type="button" class="choice" data-schedule="REPEATED_WEEKLY">
          <span class="choice__icon" aria-hidden="true">🗓️</span>
          <span class="choice__name">Weekly</span>
          <span class="choice__hint">On chosen days of the week</span>
        </button>
        <button type="button" class="choice" data-schedule="REPEATED_MONTHLY">
          <span class="choice__icon" aria-hidden="true">🌙</span>
          <span class="choice__name">Monthly</span>
          <span class="choice__hint">On a day of chosen months</span>
        </button>
      </div>
    </section>

    <!-- Final step: the details for whatever was chosen -->
    <form class="wizard__step" data-step="details" id="composer-form" method="dialog" hidden>
      <label class="field">
        <span class="field__label">Name</span>
        <input class="field__input" name="name" required maxlength="255" autocomplete="off"
               placeholder="Drink water">
      </label>

      <label class="field">
        <span class="field__label">Category</span>
        <select class="field__input" name="category" id="composer-category"></select>
      </label>

      <!-- No legend and no box: most tasks have no links, and a titled panel
           sitting empty asks a question the user did not have. -->
      <div class="field" data-for="BASIC EVENT DAILY REPEATED_WEEKLY REPEATED_MONTHLY">
        <div class="rows" id="link-rows"></div>
        <button type="button" class="btn btn--small" id="add-link">+ Link</button>
      </div>

      <label class="field" data-for="EVENT" hidden>
        <span class="field__label">When</span>
        <input class="field__input" name="date" type="datetime-local">
      </label>

      <fieldset class="field" data-for="BASIC EVENT">
        <legend class="field__label">Steps</legend>
        <div class="rows" id="subtask-rows"></div>
        <button type="button" class="btn btn--small" id="add-subtask">+ Step</button>
      </fieldset>

      <div class="field-row field-row--times" data-for="DAILY" hidden>
        <label class="field">
          <span class="field__label">From</span>
          <input class="field__input" name="startsAt" type="time" value="09:00">
        </label>
        <label class="field">
          <span class="field__label">Until</span>
          <input class="field__input" name="endsAt" type="time" value="23:00">
        </label>
        <label class="field">
          <span class="field__label">Every</span>
          <input class="field__input" name="repeatEach" type="time" value="02:00">
        </label>
      </div>

      <fieldset class="field" data-for="REPEATED_WEEKLY" hidden>
        <legend class="field__label">Days</legend>
        <div class="toggles" id="weekday-toggles"></div>
      </fieldset>

      <div data-for="REPEATED_MONTHLY" hidden>
        <div class="field-row">
          <label class="field">
            <span class="field__label">From day</span>
            <input class="field__input" name="fromDay" type="number" min="1" max="31" value="1">
          </label>
          <label class="field">
            <span class="field__label">To day</span>
            <input class="field__input" name="toDay" type="number" min="1" max="31" value="5">
          </label>
        </div>
        <fieldset class="field">
          <legend class="field__label">Months</legend>
          <div class="toggles" id="month-toggles"></div>
        </fieldset>
      </div>

      <div class="composer__actions">
        <button type="button" class="btn" id="details-cancel">Cancel</button>
        <button type="submit" class="btn btn--primary" id="details-save">Add</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Classic scripts run before the deferred module below, so the SDK and the
     config are on globalThis by the time app.js imports notifications.js.
     The compat build is deliberate: it needs no bundler, matching the rest of
     this folder. -->
<script src="./firebase-config.js?v=13"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script type="module" src="./app.js?v=13"></script>
</body>
</html>
